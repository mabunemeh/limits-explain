name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # Creating the GitHub release and uploading its assets.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser reads tags to work out the version and previous release.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        # A tag can be pushed on a commit CI never saw, so test before
        # publishing anything.
        run: go test ./...

      - name: Release notes
        # The release body is this version's CHANGELOG.md section; a tag
        # without one fails here, before anything is published.
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
